[workspace]
members = [".", "dq_test_macros", "dq_test_fixtures"]
resolver = "3"

[package]
name = "dq"
version = "0.7.1"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.60", features = ["derive"] }
duckdb = { git = "https://github.com/ryanmiville/duckdb-rs.git", branch = "main", features = ["duckbox"] }
libc = "0.2.182"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
terminal_size = "0.4.3"

[dev-dependencies]
tempfile = "3.26.0"
dq_test_fixtures = { path = "dq_test_fixtures" }
dq_test_macros = { path = "dq_test_macros" }
indoc = "2.0.7"
