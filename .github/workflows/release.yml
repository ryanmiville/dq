name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0, 0.2.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! npx --yes semver "$VERSION" > /dev/null 2>&1; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

      - name: Check on main branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Releases must be triggered from main branch"
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml

  prepare:
    needs: [validate, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cargo.toml version
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ needs.validate.outputs.version }}"/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo check --quiet

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "release: v${{ needs.validate.outputs.version }}"
          git tag "v${{ needs.validate.outputs.version }}"
          git push origin main
          git push origin "v${{ needs.validate.outputs.version }}"

  release:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Create source release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true

  homebrew:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    outputs:
      pull_request: ${{ steps.create-pr.outputs.pull-request-number }}
      head_sha: ${{ steps.create-pr.outputs.pull-request-head-sha }}

    steps:
      - name: Get source tarball SHA256
        id: sha
        run: |
          url="https://github.com/ryanmiville/dq/archive/refs/tags/v${{ needs.prepare.outputs.version }}.tar.gz"
          sha=$(curl --fail --silent --show-error --location "$url" | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ryanmiville/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/dq.rb")
          contents = formula.read_text()

          # A bottle is specific to one formula version. Remove the previous
          # version's metadata; brew pr-pull adds the newly built bottle block.
          contents, bottle_count = re.subn(
              r"\n  bottle do\n.*?\n  end\n",
              "",
              contents,
              count=1,
              flags=re.DOTALL,
          )

          url = (
              "https://github.com/ryanmiville/dq/archive/refs/tags/"
              f"v{os.environ['VERSION']}.tar.gz"
          )
          source = re.compile(
              r'^  url "https://github\.com/ryanmiville/dq/[^\n]+"\n'
              r'  sha256 "[0-9a-f]{64}"$',
              flags=re.MULTILINE,
          )
          contents, source_count = source.subn(
              f'  url "{url}"\n  sha256 "{os.environ["SHA256"]}"',
              contents,
              count=1,
          )
          if source_count != 1:
              raise SystemExit("could not uniquely update the dq source URL and SHA256")

          formula.write_text(contents)
          print(f"updated source; removed {bottle_count} previous bottle block(s)")
          PY

      - name: Create bottle PR
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          commit-message: "Update dq to v${{ needs.prepare.outputs.version }}"
          title: "Update dq to v${{ needs.prepare.outputs.version }}"
          body: |
            Automated update from [dq v${{ needs.prepare.outputs.version }}](https://github.com/ryanmiville/dq/releases/tag/v${{ needs.prepare.outputs.version }}).

            The tap's `brew test-bot` workflow builds the Homebrew bottles for this PR. The dq release workflow will publish the bottles and close this PR after all bottle builds pass; do not merge it manually.
          branch: update-dq-${{ needs.prepare.outputs.version }}
          base: main
          draft: true

  # TAP_GITHUB_TOKEN needs Actions, Contents, and Pull requests read/write
  # access to ryanmiville/homebrew-tap.
  publish-homebrew:
    needs: [prepare, homebrew]
    if: ${{ needs.homebrew.outputs.pull_request != '' && needs.homebrew.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      bottle-builds_url: ${{ steps.bottle-builds.outputs.url }}
      publish_url: ${{ steps.publish.outputs.url }}

    steps:
      - name: Wait for bottle builds
        id: bottle-builds
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.homebrew.outputs.head_sha }}
        run: |
          for attempt in $(seq 1 180); do
            run=$(gh api --method GET \
              repos/ryanmiville/homebrew-tap/actions/workflows/tests.yml/runs \
              -f event=pull_request \
              -f head_sha="$HEAD_SHA" \
              -F per_page=10 \
              --jq '.workflow_runs[0] // empty')

            if [ -z "$run" ]; then
              echo "Waiting for the bottle workflow to start ($attempt/180)..."
              sleep 10
              continue
            fi

            status=$(jq -r '.status' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            url=$(jq -r '.html_url' <<<"$run")
            echo "Bottle workflow: $status ${conclusion:+($conclusion)}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::Bottle builds failed: $url"
                exit 1
              fi

              run_id=$(jq -r '.id' <<<"$run")
              artifacts=$(gh api \
                "repos/ryanmiville/homebrew-tap/actions/runs/${run_id}/artifacts" \
                --jq '.artifacts[] | select(.expired == false) | .name')
              for expected in \
                bottles_macos-15 \
                bottles_macos-15-intel \
                bottles_ubuntu-latest; do
                if ! grep -Fxq "$expected" <<<"$artifacts"; then
                  echo "::error::Bottle workflow did not produce $expected: $url"
                  exit 1
                fi
              done

              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for bottle builds"
          exit 1

      - name: Publish bottles
        id: publish
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.homebrew.outputs.head_sha }}
          PULL_REQUEST: ${{ needs.homebrew.outputs.pull_request }}
        run: |
          dispatched_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh workflow run publish.yml \
            --repo ryanmiville/homebrew-tap \
            --ref main \
            -f pull_request="$PULL_REQUEST" \
            -f head_sha="$HEAD_SHA"

          for attempt in $(seq 1 30); do
            run=$(gh run list \
              --repo ryanmiville/homebrew-tap \
              --workflow publish.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,url \
              --jq "map(select(.createdAt >= \"$dispatched_at\"))[0] // empty")

            if [ -n "$run" ]; then
              run_id=$(jq -r '.databaseId' <<<"$run")
              url=$(jq -r '.url' <<<"$run")
              echo "url=$url" >> "$GITHUB_OUTPUT"
              gh run watch "$run_id" \
                --repo ryanmiville/homebrew-tap \
                --exit-status
              exit 0
            fi

            echo "Waiting for the publish workflow to start ($attempt/30)..."
            sleep 5
          done

          echo "::error::Timed out waiting for the publish workflow to start"
          exit 1

      - name: Verify published formula and bottles
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          formula=$(gh api \
            repos/ryanmiville/homebrew-tap/contents/Formula/dq.rb \
            -H "Accept: application/vnd.github.raw+json")
          grep -Fq "/tags/v${VERSION}.tar.gz" <<<"$formula"
          grep -Fq "  bottle do" <<<"$formula"

          asset_count=$(gh release view "dq-${VERSION}" \
            --repo ryanmiville/homebrew-tap \
            --json assets \
            --jq '.assets | length')
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::Homebrew release dq-${VERSION} has no bottle assets"
            exit 1
          fi

  summary:
    needs: [prepare, release, homebrew, publish-homebrew]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_RESULT: ${{ needs.release.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
          HOMEBREW_PUBLISH_RESULT: ${{ needs.publish-homebrew.result }}
          BOTTLE_BUILD_URL: ${{ needs.publish-homebrew.outputs.bottle-builds_url }}
          BOTTLE_PUBLISH_URL: ${{ needs.publish-homebrew.outputs.publish_url }}
        run: |
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| GitHub source release | ${RELEASE_RESULT} |"
            echo "| Homebrew bottle PR | ${HOMEBREW_RESULT} |"
            echo "| Homebrew bottle publication | ${HOMEBREW_PUBLISH_RESULT} |"
            echo ""
            [ -z "$BOTTLE_BUILD_URL" ] || echo "Bottle builds: $BOTTLE_BUILD_URL"
            [ -z "$BOTTLE_PUBLISH_URL" ] || echo "Bottle publication: $BOTTLE_PUBLISH_URL"
          } >> "$GITHUB_STEP_SUMMARY"
