name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0, 0.2.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! npx --yes semver "$VERSION" > /dev/null 2>&1; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't exist
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

      - name: Check on main branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Releases must be triggered from main branch"
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml

  prepare:
    needs: [validate, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Cargo.toml version
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ needs.validate.outputs.version }}"/' Cargo.toml

      - name: Update Cargo.lock
        run: cargo check --quiet

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "release: v${{ needs.validate.outputs.version }}"
          git tag "v${{ needs.validate.outputs.version }}"
          git push origin main
          git push origin "v${{ needs.validate.outputs.version }}"

  release:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Create source release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true

  homebrew:
    needs: [prepare, release]
    runs-on: ubuntu-latest

    steps:
      - name: Get source tarball SHA256
        id: sha
        run: |
          url="https://github.com/ryanmiville/dq/archive/refs/tags/v${{ needs.prepare.outputs.version }}.tar.gz"
          sha=$(curl --fail --silent --show-error --location "$url" | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ryanmiville/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/dq.rb")
          contents = formula.read_text()

          # A bottle is specific to one formula version. Remove the previous
          # version's metadata; brew pr-pull adds the newly built bottle block.
          contents, bottle_count = re.subn(
              r"\n  bottle do\n.*?\n  end\n",
              "\n",
              contents,
              count=1,
              flags=re.DOTALL,
          )

          url = (
              "https://github.com/ryanmiville/dq/archive/refs/tags/"
              f"v{os.environ['VERSION']}.tar.gz"
          )
          source = re.compile(
              r'^  url "https://github\.com/ryanmiville/dq/[^\n]+"\n'
              r'  sha256 "[0-9a-f]{64}"$',
              flags=re.MULTILINE,
          )
          contents, source_count = source.subn(
              f'  url "{url}"\n  sha256 "{os.environ["SHA256"]}"',
              contents,
              count=1,
          )
          if source_count != 1:
              raise SystemExit("could not uniquely update the dq source URL and SHA256")

          formula.write_text(contents)
          print(f"updated source; removed {bottle_count} previous bottle block(s)")
          PY

      - name: Create bottle PR
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          commit-message: "Update dq to v${{ needs.prepare.outputs.version }}"
          title: "Update dq to v${{ needs.prepare.outputs.version }}"
          body: |
            Automated update from [dq v${{ needs.prepare.outputs.version }}](https://github.com/ryanmiville/dq/releases/tag/v${{ needs.prepare.outputs.version }}).

            The tap's `brew test-bot` workflow builds the Homebrew bottles for this PR. After its checks pass, publish it with the tap's `brew pr-pull` workflow, using this PR number and head SHA.
          branch: update-dq-${{ needs.prepare.outputs.version }}
          base: main

  summary:
    needs: [prepare, release, homebrew]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_RESULT: ${{ needs.release.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
        run: |
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| GitHub source release | ${RELEASE_RESULT} |"
            echo "| Homebrew bottle PR | ${HOMEBREW_RESULT} |"
            echo ""
            echo "The Homebrew tap builds and publishes the installable bottles; dq no longer builds duplicate standalone release archives."
          } >> "$GITHUB_STEP_SUMMARY"
