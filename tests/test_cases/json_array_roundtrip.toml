cmd = "{dq} from json | {dq} to json-array"

[[cases]]
name = "single_row"
input = """
[
        {"name":"Ada","age":37}
]
"""
[cases.expect]
kind = "same"

[[cases]]
name = "two_rows"
input = """
[
    {"name":"Ada","age":37},
    {"name":"Linus","age":54}
]
"""
[cases.expect]
kind = "same"

[[cases]]
name = "complex_types"
input = """
[
    {"a":1,"b":[1,2],"c":{"x":true},"d":null,"e":"hi"}
]
"""
[cases.expect]
kind = "same"

[[cases]]
name = "multiple_scalar"
input = """
[
    {"id":1,"score":1.25,"active":false},
    {"id":2,"score":0.0,"active":true}
]
"""
[cases.expect]
kind = "same"

[[cases]]
name = "empty"
input = ""
[cases.expect]
kind = "exact"
stdout = """
[

]
"""

[[cases]]
name = "invalid_input"
input = """
not-json
"""
success = false
[cases.expect]
kind = "stderr_contains"
text = "Malformed JSON"
