cmd = "{dq} from jsonl | {dq} where \"age >= 40\" | {dq} to jsonl"

[[cases]]
name = "filters_matching_rows"
input = """
{"name":"Ada","age":37}
{"name":"Linus","age":54}
{"name":"Grace","age":40}
"""
[cases.expect]
kind = "exact"
stdout = """
{"name":"Linus","age":54}
{"name":"Grace","age":40}
"""

[[cases]]
name = "filters_all_rows"
input = """
{"name":"Linus","age":54}
{"name":"Grace","age":40}
"""
[cases.expect]
kind = "exact"
stdout = """
{"name":"Linus","age":54}
{"name":"Grace","age":40}
"""

[[cases]]
name = "filters_no_rows"
input = """
{"name":"Ada","age":37}
{"name":"Edsger","age":39}
"""
[cases.expect]
kind = "exact"
stdout = """
"""

[[cases]]
name = "empty"
input = ""
success = false
[cases.expect]
kind = "stderr_contains"
text = "IO Error"
