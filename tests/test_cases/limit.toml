cmd = "{dq} from json | {dq} limit 2 | {dq} to json"

[[cases]]
name = "limits_rows"
input = """
{"name":"Ada","age":37}
{"name":"Linus","age":54}
{"name":"Grace","age":40}
"""
[cases.expect]
kind = "exact"
stdout = """
{"name":"Ada","age":37}
{"name":"Linus","age":54}
"""

[[cases]]
name = "fewer_rows_than_limit"
input = """
{"name":"Ada","age":37}
"""
[cases.expect]
kind = "exact"
stdout = """
{"name":"Ada","age":37}
"""

[[cases]]
name = "empty"
input = ""
[cases.expect]
kind = "exact"
stdout = """
"""
