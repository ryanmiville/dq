cmd = "{dq} from json | {dq} to pretty"

[[cases]]
name = "null_display"
input = """
[
    {"name":"Ada","nickname":null,"active":true}
]
"""
[cases.expect]
kind = "exact"
stdout = """
┌─────────┬──────────┬─────────┐
│  name   │ nickname │ active  │
│ varchar │ varchar  │ boolean │
├─────────┼──────────┼─────────┤
│ Ada     │ NULL     │ true    │
└─────────┴──────────┴─────────┘
"""

