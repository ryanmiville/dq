cmd = '''
temp_dir=$(mktemp -d)
trap 'rm -rf "$temp_dir"' EXIT
export XDG_CONFIG_HOME="$temp_dir"
mkdir -p "$XDG_CONFIG_HOME/dq/plugins"
cat > "$XDG_CONFIG_HOME/dq/plugins/probe.toml" <<'PLUGIN'
api_version = 1
id = "destination-probe"
kind = "format"
[[formats]]
name = "destination-probe"
read = "(SELECT error(CASE WHEN (SELECT count(*) FROM which_secret('s3://bucket/output.json', 's3')) = 1 THEN 'S3 destination setup is ready' ELSE 'S3 setup is missing' END))"
PLUGIN
{dq} from destination-probe | {dq} to s3://bucket/output.json
'''

[[cases]]
name = "initializes_output_storage_before_query"
input = ""
success = false
[cases.expect]
kind = "stderr_contains"
text = "S3 destination setup is ready"
